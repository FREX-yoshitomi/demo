name: Deploy to GitHub Pages

# main ブランチに変更が入ったら自動でサイトを公開する
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を1つに絞る（公開の競合を防ぐ）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Pages がまだ有効化されていなければ、このワークフローから自動で有効化する
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # リポジトリ直下の静的ファイルをそのまま公開
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
