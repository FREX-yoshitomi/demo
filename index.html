<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>武雄高校 同窓会</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://takeo-dousoukai.github.io/">
<script src="config.js"></script>
<script>
  // サイトは https://takeo-dousoukai.github.io/ に移転しました。
  // この旧URLに未送信の回答が残っていれば、先に送り直してから移動する。
  (function () {
    try {
      var raw = localStorage.getItem("takeo_reunion_pending");
      if (raw && typeof apiCall === "function") {
        apiCall("rsvp", JSON.parse(raw), { keepalive: true })
          .then(function () { try { localStorage.removeItem("takeo_reunion_pending"); } catch (e) {} })
          .catch(function () {});
      }
    } catch (e) {}
    location.replace("https://takeo-dousoukai.github.io/" + location.search + location.hash);
  })();
</script>
<style>
  body { margin: 0; background: #f5f1e8; color: #1f2430; font-family: serif; padding: 48px 16px; text-align: center; }
  a { color: #b3402a; }
</style>
</head>
<body>
<p>同窓会のページは新しいアドレスに移りました。</p>
<p><a href="https://takeo-dousoukai.github.io/">https://takeo-dousoukai.github.io/</a></p>
</body>
</html>
