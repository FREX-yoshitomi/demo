packages:
  - "packages/*"
  - "functions"
  - "app"
  - "web"
  - "jobs/*"
  - "firebase/rules-tests"
allowBuilds:
  '@firebase/util': true
  esbuild: true
  # サムネイル生成 (F-301) 用の静的 ffmpeg バイナリを取得する
  ffmpeg-static: true
  protobufjs: true
  # re2 はネイティブビルドが必要で、Firestore ルールの評価には使われないため無効のまま
  re2: false
